# Cada vez que se sube o cambia un PDF en documentos/, saca su texto para que Dayana (el chat de la página) lo pueda consultar.
name: Textos de los PDF para Dayana
on:
  push:
    branches: [main]
    paths: ['documentos/**.pdf', 'documentos/**.PDF', '.github/scripts/textos_pdf.py', '.github/workflows/textos-pdf.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: textos-pdf
  cancel-in-progress: false
jobs:
  textos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Sacar el texto de los PDF
        run: python3 .github/scripts/textos_pdf.py .
      - name: Guardar documentos/textos.json
        run: |
          git config user.name "Textos PDF (Dayana)"
          git config user.email "actions@users.noreply.github.com"
          git add documentos/textos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Textos de los PDF para Dayana"
          git pull --rebase origin main
          git push
